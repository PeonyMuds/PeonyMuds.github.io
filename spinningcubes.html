<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinning Cubes</title>
  <style>
  	body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #333;
  margin: 0;
  perspective: 1000px;
}

.scene {
  display: flex;
  gap: 7rem;
  transform: rotateX(0deg)
}

.cube {
  position: relative;
  width: 3rem;
  height: 6rem;
  transform-style: preserve-3d;
  animation: rotate 5s infinite linear;
}

.cube1 {
  animation-duration: 9s;
}

.cube2 {
  animation-duration: 13s;
}

.cube3 {
  animation-duration: 11s;
}

.face {
  position: absolute;
  width: 3rem;
  height: 3rem;
  background-color: #0283A5;
  border: 1px solid #ccc;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
}

.face2 {
  position: absolute;
  width: 3rem;
  height: 6rem;
  background-color: #0283A5;
  border: 1px solid #ccc;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
}


.front  { transform: translateZ(1.5rem); }
.back   { transform: rotateY(180deg) translateZ(1.5rem); }
.left   { transform: rotateY(-90deg) translateZ(1.5rem); }
.right  { transform: rotateY(90deg) translateZ(1.5rem); }
.top    { transform: rotateX(90deg) translateZ(1.5rem); }
.bottom { transform: rotateX(-90deg) translateZ(4.5rem); }

@keyframes rotate {
  from {
    transform: rotateY(0deg) rotatex(10deg) rotatez(10deg);
  } 
  to {
    transform: rotateY(360deg) rotatex(10deg) rotatez(10deg);
  }
}
  </style>
</head>
<body>
  <div class="scene">
    <div class="cube cube1">
      <div class="face2 front"></div>
      <div class="face2 back"></div>
      <div class="face2 left"></div>
      <div class="face2 right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div class="cube cube2">
      <div class="face2 front"></div>
      <div class="face2 back"></div>
      <div class="face2 left"></div>
      <div class="face2 right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div class="cube cube3">
      <div class="face2 front"></div>
      <div class="face2 back"></div>
      <div class="face2 left"></div>
      <div class="face2 right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</body>
</html>
