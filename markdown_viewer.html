<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Markdown Viewer for WEI Shengnan">
  <link rel="shortcut icon" href="assets/icon.ico" alt="Site Icon"/>
  <title>WEI Shengnan: Markdown Viewer</title>
  <link rel="stylesheet" type="text/css" href="elements/styles.css">
  <script src="scripts/reponsivefontsize.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
</head>
<body>
  <!-- js load nav bar -->
  <div id="jsnav"></div>
  <script src="scripts/loadnav.js" defer></script>

  <div class="container">
    <div class="left-column">
      <div>
        <h2>Markdown Viewer</h2>
      </div>
      <!-- js load footer for large screens -->
      <div id="jsfooter" class="footer-large-screen"></div>
    </div>
    <div class="right-column">
      <div id="content"></div>
    </div>
  </div>
  <!-- js load footer for small screens -->
  <div id="jsfooter-small" class="footer-small-screen"></div>
  <script src="scripts/loadfooter.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const converter = new showdown.Converter();
      const contentDiv = document.getElementById('content');

      function loadMarkdown(file) {
        fetch(file)
          .then(response => response.text())
          .then(text => {
            const html = converter.makeHtml(text);
            contentDiv.innerHTML = html;
          })
          .catch(error => console.error('Error loading markdown file:', error));
      }

      // Get the markdown file from the query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const file = urlParams.get('file');
      if (file) {
        loadMarkdown(file);
      } else {
        contentDiv.innerHTML = '<p>No file specified.</p>';
      }
    });
  </script>
</body>
</html>
