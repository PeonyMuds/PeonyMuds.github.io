<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Open Method Page for WEI Shengnan">
  <link rel="shortcut icon" href="assets/icon.ico" alt="Site Icon"/>
  <title>WEI Shengnan: Open Methods</title>
  <link rel="stylesheet" type="text/css" href="elements/styles.css">
  <script src="scripts/reponsivefontsize.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
</head>
<body>
  <!-- js load nav bar -->
  <div id="jsnav"></div>
  <script src="scripts/loadnav.js" defer></script>

  <div class="container">
    <div class="left-column">
      <div>
        <h2>Open Methods</h2>
        <p style="font-size: 20px">We are proud to support open science and will be publishing detailed experimental protocols to facilitate the dissemination and reproducibility of technology.</p>
      </div>
      <!-- js load footer for large screens -->
      <div id="jsfooter" class="footer-large-screen"></div>
    </div>
    <div class="right-column">
      <h2>Lists</h2>
      <ul id="markdown-links">
        <!-- Links to Markdown files will be generated here -->
      </ul>
      <div id="content"></div>
    </div>
  </div>
  <!-- js load footer for small screens -->
  <div id="jsfooter-small" class="footer-small-screen"></div>
  <script src="scripts/loadfooter.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const converter = new showdown.Converter();
      const contentDiv = document.getElementById('content');
      const markdownLinks = document.getElementById('markdown-links');

      const markdownFiles = [
        'markdown/CellThawing.md',
        // Add more Markdown files as needed
      ];

      function loadMarkdown(file) {
        fetch(file)
          .then(response => response.text())
          .then(text => {
            const html = converter.makeHtml(text);
            contentDiv.innerHTML = html;
          })
          .catch(error => console.error('Error loading markdown file:', error));
      }

      // Generate links to Markdown files
      markdownFiles.forEach(file => {
        const fileName = file.split('/').pop().replace('.md', '');
        const listItem = document.createElement('li');
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = fileName;
        link.setAttribute('data-file', file);
        link.classList.add('markdown-link');
        listItem.appendChild(link);
        markdownLinks.appendChild(listItem);
      });

      // Load the first markdown file by default
      if (markdownFiles.length > 0) {
        loadMarkdown(markdownFiles[0]);
      }

      // Add event listeners to the links
      const links = document.querySelectorAll('.markdown-link');
      links.forEach(link => {
        link.addEventListener('click', function(event) {
          event.preventDefault();
          const file = this.getAttribute('data-file');
          loadMarkdown(file);
        });
      });
    });
  </script>
</body>
</html>
