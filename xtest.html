<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Open Method Page for WEI Shengnan">
  <link rel="shortcut icon" href="assets/icon.ico" alt="Site Icon"/>
  <title>WEI Shengnan: Open Methods</title>
  <link rel="stylesheet" type="text/css" href="elements/styles.css">
  <script src="scripts/reponsivefontsize.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
  <style>
    /* Custom styles for the Markdown content */
    #content {
      font-size: 0.8rem; /* Adjust the font size as needed */
    }
  </style>
</head>
<body>
  <!-- js load nav bar -->
  <div id="jsnav"></div>
  <script src="scripts/loadnav.js" defer></script>

  <div class="container">
    <div class="left-column">
      <div>
        <h2>Open Methods</h2>
        <p style="font-size: 20px">We are proud to support open science and will be publishing detailed experimental protocols to facilitate the dissemination and reproducibility of technology.</p>
      </div>
      <!-- js load footer for large screens -->
      <div id="jsfooter" class="footer-large-screen"></div>
    </div>
    <div class="right-column">
      <h2>Lists</h2>
      <select id="markdown-dropdown">
        <option value="">Select a file</option>
        <!-- Options will be generated here -->
      </select>
      <div id="content"></div>
    </div>
  </div>
  <!-- js load footer for small screens -->
  <div id="jsfooter-small" class="footer-small-screen"></div>
  <script src="scripts/loadfooter.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const dropdown = document.getElementById('markdown-dropdown');
      const contentDiv = document.getElementById('content');
      const converter = new showdown.Converter();

      function loadMarkdown(file) {
        fetch(file)
          .then(response => response.text())
          .then(text => {
            const html = converter.makeHtml(text);
            contentDiv.innerHTML = html;
          })
          .catch(error => console.error('Error loading markdown file:', error));
      }

      // Fetch the list of Markdown files from the JSON file
      fetch('markdown/markdown-files.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
          }
          return response.json();
        })
        .then(data => {
          const markdownFiles = data.files;

          // Generate options for the dropdown menu
          markdownFiles.forEach(file => {
            const fileName = file.split('/').pop().replace('.md', '');
            const option = document.createElement('option');
            option.value = file;
            option.textContent = fileName;
            dropdown.appendChild(option);
          });
        })
        .catch(error => console.error('Error loading markdown files:', error));

      // Add event listener to the dropdown menu
      dropdown.addEventListener('change', function() {
        const file = this.value;
        if (file) {
          loadMarkdown(file);
        } else {
          contentDiv.innerHTML = '';
        }
      });
    });
  </script>
</body>
</html>
