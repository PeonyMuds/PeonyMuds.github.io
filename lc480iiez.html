<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC480II LayoutEZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #grid th, #grid td {
            border: 1px solid #e5e7eb;
            width: 120px;
            height: 40px;
            text-align: center;
            transition: background-color 0.2s;
            font-size: 0.75rem;
            line-height: 1.2;
        }
        #grid th {
            background-color: #f3f4f6;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            font-size: 0.75rem;
        }
        #grid td {
            cursor: pointer;
        }
        #grid td.selected {
            background-color: #93c5fd;
        }
        #grid td.only-sample {
            background-color: #fefcbf;
        }
        #grid td.only-gene {
            background-color: #e9d5ff;
        }
        #grid td.both-values {
            background-color: #a7f3d0;
        }
        #grid td.selected.only-sample {
            background-color: #bfdbfe; /* Blend blue and yellow */
        }
        #grid td.selected.only-gene {
            background-color: #c4b5fd; /* Blend blue and purple */
        }
        #grid td.selected.both-values {
            background-color: #6ee7b7; /* Blend blue and green */
        }
        #grid td:hover:not(.selected):not(.only-sample):not(.only-gene):not(.both-values) {
            background-color: #e5e7eb;
        }
        #grid th:hover {
            background-color: #d1d5db;
        }
        #grid.dragging {
            user-select: none;
        }
        .target-gene {
            font-style: italic;
        }
        .value-text {
            padding: 1px 3px;
            border-radius: 3px;
        }
        #sidebar label, #sidebar input, #sidebar button {
            font-size: 0.75rem;
        }
        #tsv-upload label, #tsv-upload input, #tsv-upload button {
            font-size: 0.75rem;
        }
        .textured-button {
            background-image: linear-gradient(rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.05)),
                              url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect fill="rgba(255,255,255,0.05)" width="2" height="2"/></svg>');
            background-size: auto, 4px 4px;
            transition: background-color 0.3s, transform 0.1s;
        }
        .textured-button:hover {
            transform: translateY(-1px);
        }
        .copyright {
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            #grid th, #grid td {
                width: 90px;
                height: 30px;
                font-size: 0.6rem;
            }
            #sidebar, #tsv-upload {
                width: 100%;
                max-width: 300px;
            }
            #sidebar label, #sidebar input, #sidebar button {
                font-size: 0.6rem;
            }
            #tsv-upload label, #tsv-upload input, #tsv-upload button {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">
    <div class="flex flex-col md:flex-row w-full max-w-7xl bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-4 overflow-x-auto">
            <table id="grid" class="border-collapse"></table>
        </div>
        <div id="sidebar" class="p-6 w-full md:w-80 bg-gray-50 border-l border-gray-200">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">LC480II LayoutEZ</h2>
            <div class="mb-4">
                <label for="sampleName" class="block font-medium text-gray-700 mb-1">Sample Name</label>
                <input type="text" id="sampleName" placeholder="Enter Sample Name" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label for="targetGene" class="block font-medium text-gray-700 mb-1">Target Gene</label>
                <input type="text" id="targetGene" placeholder="Enter Target Gene" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="space-y-2">
                <button onclick="applyValues()" class="w-full py-2 bg-blue-600 text-white rounded-md textured-button">Apply to Selected</button>
                <button onclick="removeSelections()" class="w-full py-2 bg-gray-500 text-white rounded-md textured-button">Remove Current Selections</button>
            </div>
            <div class="space-y-2 mt-4">
                <button onclick="clearSelectedSampleNames()" class="w-full py-2 bg-orange-500 text-white rounded-md textured-button">Clear Selected Sample Names</button>
                <button onclick="clearSelectedTargetGenes()" class="w-full py-2 bg-orange-500 text-white rounded-md textured-button">Clear Selected Target Genes</button>
                <button onclick="clearSelectedValues()" class="w-full py-2 bg-orange-500 text-white rounded-md textured-button">Clear Values of Selected</button>
                <button onclick="clearAll()" class="w-full py-2 bg-red-500 text-white rounded-md textured-button">Reset All Cells</button>
            </div>
            <div class="mt-4">
                <label for="tsvFileName" class="block font-medium text-gray-700 mb-1">TSV File Name</label>
                <input type="text" id="tsvFileName" placeholder="Enter file name" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2">
                <button onclick="generateTSV()" class="w-full py-2 bg-green-600 text-white rounded-md textured-button">Generate TSV File</button>
            </div>
        </div>
    </div>
    <div id="tsv-upload" class="mt-4 w-full max-w-7xl bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-semibold mb-4 text-gray-800">Upload TSV Layout</h2>
        <div class="mb-4">
            <label for="tsvUpload" class="block font-medium text-gray-700 mb-1">Select TSV File</label>
            <input type="file" id="tsvUpload" accept=".tsv,.txt" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button onclick="loadTSVLayout()" class="w-full py-2 bg-blue-600 text-white rounded-md textured-button">Load TSV Layout</button>
    </div>
    <div class="copyright">
        © 2025 WEI Shengnan. All rights reserved.
    </div>

    <script>
        const rows = 16;
        const cols = 24;
        const grid = document.getElementById('grid');
        const rowLabels = Array.from({length: rows}, (_, i) => String.fromCharCode(65 + i)); // A to P
        let isDragging = false;
        let startElement = null;
        let dragType = null; // 'cell', 'row', or 'column'

        // Color palette for text backgrounds (light, diverse, avoiding cell status colors)
        const colorPalette = [
            '#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff',
            '#a0c4ff', '#bdb2ff', '#ffc6ff', '#ffccd5', '#ffddbf',
            '#ffef9f', '#d4ffea', '#bff0ff', '#d9b8ff', '#ffbee3',
            '#ffcab0', '#e6ffbf', '#bffbff', '#e6ccff', '#ffc1cc'
        ];
        const sampleNameColors = {};
        const targetGeneColors = {};

        // Assign a color to a value
        function getValueColor(value, type) {
            const map = type === 'sample' ? sampleNameColors : targetGeneColors;
            if (!map[value]) {
                const colorIndex = Object.keys(map).length % colorPalette.length;
                map[value] = colorPalette[colorIndex];
            }
            return map[value];
        }

        // Initialize grid
        function createGrid() {
            grid.innerHTML = '';
            // Header row
            let headerRow = '<tr><th class="sticky top-0 left-0 bg-gray-200"></th>';
            for (let col = 1; col <= cols; col++) {
                headerRow += `<th data-col="${col}" onmousedown="startDrag(this, 'column')" onmouseover="dragSelect(this)" onmouseup="endDrag()">${col}</th>`;
            }
            headerRow += '</tr>';
            grid.innerHTML += headerRow;

            // Data rows
            for (let row = 0; row < rows; row++) {
                let rowHTML = `<tr><th data-row="${rowLabels[row]}" onmousedown="startDrag(this, 'row')" onmouseover="dragSelect(this)" onmouseup="endDrag()" class="sticky left-0 bg-gray-200">${rowLabels[row]}</th>`;
                for (let col = 1; col <= cols; col++) {
                    rowHTML += `<td data-row="${rowLabels[row]}" data-col="${col}" onmousedown="startDrag(this, 'cell')" onmouseover="dragSelect(this)" onmouseup="endDrag()"></td>`;
                }
                rowHTML += '</tr>';
                grid.innerHTML += rowHTML;
            }
        }

        // Clear all selections
        function clearSelections() {
            document.querySelectorAll('#grid td.selected').forEach(cell => {
                cell.classList.remove('selected');
            });
        }

        // Start drag selection
        function startDrag(element, type) {
            isDragging = true;
            startElement = element;
            dragType = type;
            grid.classList.add('dragging');
            clearSelections();

            if (type === 'row') {
                selectRow(element.dataset.row);
            } else if (type === 'column') {
                selectColumn(parseInt(element.dataset.col));
            } else {
                element.classList.add('selected');
            }
            updateSidebarInputs();
        }

        // Drag to select
        function dragSelect(element) {
            if (!isDragging) return;

            clearSelections();
            if (dragType === 'row' && element.dataset.row) {
                const startRowIndex = rowLabels.indexOf(startElement.dataset.row);
                const endRowIndex = rowLabels.indexOf(element.dataset.row);
                const minRow = Math.min(startRowIndex, endRowIndex);
                const maxRow = Math.max(startRowIndex, endRowIndex);

                for (let r = minRow; r <= maxRow; r++) {
                    const cells = document.querySelectorAll(`td[data-row="${rowLabels[r]}"]`);
                    cells.forEach(cell => cell.classList.add('selected'));
                }
            } else if (dragType === 'column' && element.dataset.col) {
                const startCol = parseInt(startElement.dataset.col);
                const endCol = parseInt(element.dataset.col);
                const minCol = Math.min(startCol, endCol);
                const maxCol = Math.max(startCol, endCol);

                for (let c = minCol; c <= maxCol; c++) {
                    const cells = document.querySelectorAll(`td[data-col="${c}"]`);
                    cells.forEach(cell => cell.classList.add('selected'));
                }
            } else if (dragType === 'cell' && element.dataset.row && element.dataset.col) {
                const startRow = rowLabels.indexOf(startElement.dataset.row);
                const startCol = parseInt(startElement.dataset.col);
                const endRow = rowLabels.indexOf(element.dataset.row);
                const endCol = parseInt(element.dataset.col);
                const minRow = Math.min(startRow, endRow);
                const maxRow = Math.max(startRow, endRow);
                const minCol = Math.min(startCol, endCol);
                const maxCol = Math.max(startCol, endCol);

                for (let r = minRow; r <= maxRow; r++) {
                    for (let c = minCol; c <= maxCol; c++) {
                        const targetCell = document.querySelector(`td[data-row="${rowLabels[r]}"][data-col="${c}"]`);
                        if (targetCell) targetCell.classList.add('selected');
                    }
                }
            }
            updateSidebarInputs();
        }

        // End drag
        function endDrag() {
            isDragging = false;
            dragType = null;
            grid.classList.remove('dragging');
        }

        // Toggle single cell
        function toggleCell(cell) {
            clearSelections();
            cell.classList.add('selected');
            updateSidebarInputs();
        }

        // Select entire row
        function selectRow(rowLabel) {
            clearSelections();
            const cells = document.querySelectorAll(`td[data-row="${rowLabel}"]`);
            cells.forEach(cell => cell.classList.add('selected'));
            updateSidebarInputs();
        }

        // Select entire column
        function selectColumn(col) {
            clearSelections();
            const cells = document.querySelectorAll(`td[data-col="${col}"]`);
            cells.forEach(cell => cell.classList.add('selected'));
            updateSidebarInputs();
        }

        // Remove current selections
        function removeSelections() {
            clearSelections();
            updateSidebarInputs();
        }

        // Clear Sample Names for selected cells
        function clearSelectedSampleNames() {
            const selectedCells = document.querySelectorAll('#grid td.selected');
            selectedCells.forEach(cell => {
                cell.dataset.sampleName = '';
                updateCellAppearance(cell);
            });
            updateSidebarInputs();
        }

        // Clear Target Genes for selected cells
        function clearSelectedTargetGenes() {
            const selectedCells = document.querySelectorAll('#grid td.selected');
            selectedCells.forEach(cell => {
                cell.dataset.targetGene = '';
                updateCellAppearance(cell);
            });
            updateSidebarInputs();
        }

        // Clear values for selected cells
        function clearSelectedValues() {
            const selectedCells = document.querySelectorAll('#grid td.selected');
            selectedCells.forEach(cell => {
                cell.classList.remove('only-sample', 'only-gene', 'both-values');
                cell.dataset.sampleName = '';
                cell.dataset.targetGene = '';
                cell.title = '';
                cell.innerHTML = '';
            });
            updateSidebarInputs();
        }

        // Clear all cells
        function clearAll(noConfirm = false) {
            if (!noConfirm && !confirm('Are you sure you want to reset all cells? This will clear all Sample Names and Target Genes.')) {
                return;
            }
            const allCells = document.querySelectorAll('#grid td');
            allCells.forEach(cell => {
                cell.classList.remove('selected', 'only-sample', 'only-gene', 'both-values');
                cell.dataset.sampleName = '';
                cell.dataset.targetGene = '';
                cell.title = '';
                cell.innerHTML = '';
            });
            updateSidebarInputs();
        }

        // Update cell appearance based on values
        function updateCellAppearance(cell) {
            const sampleName = cell.dataset.sampleName || '';
            const targetGene = cell.dataset.targetGene || '';
            cell.classList.remove('only-sample', 'only-gene', 'both-values');

            let displayHTML = '';
            if (sampleName && targetGene) {
                cell.classList.add('both-values');
                displayHTML = `<span class="value-text" style="background-color: ${getValueColor(sampleName, 'sample')}">${sampleName}</span><br><span class="value-text target-gene" style="background-color: ${getValueColor(targetGene, 'gene')}">${targetGene}</span>`;
            } else if (sampleName) {
                cell.classList.add('only-sample');
                displayHTML = `<span class="value-text" style="background-color: ${getValueColor(sampleName, 'sample')}">${sampleName}</span>`;
            } else if (targetGene) {
                cell.classList.add('only-gene');
                displayHTML = `<span class="value-text target-gene" style="background-color: ${getValueColor(targetGene, 'gene')}">${targetGene}</span>`;
            }

            cell.innerHTML = displayHTML;
            cell.title = `Sample: ${sampleName || 'None'}\nGene: ${targetGene || 'None'}`;
        }

        // Update sidebar inputs
        function updateSidebarInputs() {
            const selectedCells = document.querySelectorAll('#grid td.selected');
            const sampleNameInput = document.getElementById('sampleName');
            const targetGeneInput = document.getElementById('targetGene');

            if (selectedCells.length > 0) {
                const sampleNames = Array.from(selectedCells).map(cell => cell.dataset.sampleName || '');
                const targetGenes = Array.from(selectedCells).map(cell => cell.dataset.targetGene || '');
                const uniqueSampleNames = [...new Set(sampleNames)];
                const uniqueTargetGenes = [...new Set(targetGenes)];

                sampleNameInput.value = uniqueSampleNames.length === 1 ? uniqueSampleNames[0] : 'Multiple values';
                targetGeneInput.value = uniqueTargetGenes.length === 1 ? uniqueTargetGenes[0] : 'Multiple values';
            } else {
                sampleNameInput.value = '';
                targetGeneInput.value = '';
            }
        }

        // Apply values to selected cells
        function applyValues() {
            const sampleName = document.getElementById('sampleName').value.trim();
            const targetGene = document.getElementById('targetGene').value.trim();
            const selectedCells = document.querySelectorAll('#grid td.selected');

            selectedCells.forEach(cell => {
                if (sampleName && sampleName !== 'Multiple values') cell.dataset.sampleName = sampleName;
                if (targetGene && targetGene !== 'Multiple values') cell.dataset.targetGene = targetGene;
                updateCellAppearance(cell);
                cell.classList.remove('selected');
            });

            // Clear sidebar inputs
            document.getElementById('sampleName').value = '';
            document.getElementById('targetGene').value = '';

            updateSidebarInputs();
        }

        // Generate TSV file
        function generateTSV() {
            let tsvContent = 'General:Pos\t"General:Sample Name"\n';
            for (let row = 0; row < rows; row++) {
                for (let col = 1; col <= cols; col++) {
                    const cell = document.querySelector(`td[data-row="${rowLabels[row]}"][data-col="${col}"]`);
                    const pos = `${rowLabels[row]}${col}`;
                    const sampleName = cell.dataset.sampleName || '';
                    const targetGene = cell.dataset.targetGene || '';

                    let value;
                    if (!sampleName && !targetGene) {
                        value = 'NA';
                    } else if (!sampleName) {
                        value = `Unnamed sample_${targetGene}`;
                    } else if (!targetGene) {
                        value = `${sampleName}_Unnamed target`;
                    } else {
                        value = `${sampleName}_${targetGene}`;
                    }

                    tsvContent += `${pos}\t${value}\n`;
                }
            }

            // Get file name
            let fileName = document.getElementById('tsvFileName').value.trim();
            if (!fileName) {
                const now = new Date();
                const dateStr = now.toISOString().slice(0, 10); // YYYY-MM-DD
                const timeStr = now.toTimeString().slice(0, 5).replace(':', '-'); // HH-MM
                fileName = `LC480IIQuickLayout_${dateStr}_${timeStr}.txt`;
            } else if (!fileName.endsWith('.txt') && !fileName.endsWith('.tsv')) {
                fileName += '.txt';
            }

            // Create and download file
            const blob = new Blob([tsvContent], { type: 'text/tab-separated-values' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Load TSV layout
        function loadTSVLayout() {
            const fileInput = document.getElementById('tsvUpload');
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a TSV file to upload.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n').filter(line => line.trim());

                if (lines.length < 1 || lines[0].trim() !== 'General:Pos\t"General:Sample Name"') {
                    alert('Invalid TSV file: Expected header "General:Pos\t\"General:Sample Name\"".');
                    return;
                }

                // Clear grid before loading
                clearAll(true);

                // Process each data row
                for (let i = 1; i < lines.length; i++) {
                    const [pos, value] = lines[i].split('\t').map(item => item.trim());
                    if (!pos || !value) continue;

                    // Validate position (e.g., A1 to P24)
                    if (!/^[A-P]([1-9]|1[0-9]|2[0-4])$/.test(pos)) {
                        console.warn(`Skipping invalid position: ${pos}`);
                        continue;
                    }

                    const cell = document.querySelector(`td[data-row="${pos[0]}"][data-col="${pos.slice(1)}"]`);
                    if (!cell) continue;

                    let sampleName = '';
                    let targetGene = '';

                    if (value === 'NA') {
                        // Both empty
                    } else if (value.startsWith('Unnamed sample_')) {
                        targetGene = value.slice('Unnamed sample_'.length);
                    } else if (value.endsWith('_Unnamed target')) {
                        sampleName = value.slice(0, -'_Unnamed target'.length);
                    } else {
                        const parts = value.split('_');
                        if (parts.length === 2) {
                            sampleName = parts[0];
                            targetGene = parts[1];
                        }
                    }

                    cell.dataset.sampleName = sampleName;
                    cell.dataset.targetGene = targetGene;
                    updateCellAppearance(cell);
                }

                updateSidebarInputs();
                fileInput.value = ''; // Clear file input
            };
            reader.onerror = function() {
                alert('Error reading the TSV file.');
            };
            reader.readAsText(file);
        }

        // Initialize grid on page load
        createGrid();
        updateSidebarInputs();
    </script>
</body>
</html>
