<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Illustrations by WEI Shengnan">
  <link rel="shortcut icon" href="assets/icon.ico" alt="Site Icon"/>
  <title>WEI Shengnan: Illustrations</title>
  <link rel="stylesheet" type="text/css" href="elements/styles.css">
  <script src="scripts/reponsivefontsize.js" defer></script>
</head>
<body>
  <!-- js load nav bar -->
  <div id="jsnav"></div>
  <script src="scripts/loadnav.js" defer></script>

  <div class="container">
    <div class="left-column">
      <div>
        <h2>Illustrations</h2>
        <p style="font-size: 20px">I am dedicated to creating reliable illustrations for use in my logbook, presentations, and publications.</p>
      </div>
      <!-- js load footer for large screens -->
      <div id="jsfooter" class="footer-large-screen"></div>
    </div>
    <div class="right-column">
      <h2>Gallery</h2>
      <h3>Tracking and Recording Cell-Cell Contact</h3>
      <div class="gallery">
        <div class="gallery-item">
          <img src="assets/illustrations/Tracking.png" alt="Tracking cell-cell communications.">
        </div>
        <div class="gallery-item">
          <img src="assets/illustrations/Recording.png" alt="Recording cell-cell communications.">
        </div>
        <div class="gallery-item">
          <img src="assets/illustrations/Expansion - Multiple Sender.png" alt="Recording cell-cell communications with multiple sender types.">
        </div>
        <div class="gallery-item">
          <img src="assets/illustrations/Expansion - Multiple Receiver.png" alt="Recording cell-cell communications with multiple receiver types.">
        </div>
      </div>
      <h3>Macau-Hengqin Joint</h3>
      <div class="gallery">
        <div class="gallery-item">
          <img src="assets/illustrations/illuMacHQ_tiny.png" alt="Macau-Hengqin Joint">
        </div>
      </div>
    </div>
  </div>
  <!-- js load footer for small screens -->
  <div id="jsfooter-small" class="footer-small-screen"></div>
  <script src="scripts/loadfooter.js" defer></script>
</body>
</html>
