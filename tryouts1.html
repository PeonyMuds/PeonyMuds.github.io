<!DOCTYPE html>
<html>
<head>
  <style>
    .gallery {
      display: flex;
      flex-wrap: wrap;
    }

    .gallery-item {
      position: relative;
      width: 200px;
      margin: 10px;
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      transition: transform 0.3s;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .gallery-item .comment {
      text-align: center;
      font-style: italic;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="gallery-item">
      <img src="assets/tipart/work/FBS.png" alt="FBS">
      <div class="comment">1</div>
    </div>
    <div class="gallery-item">
      <img src="assets/tipart/work/FBS.png" alt="FBS">
      <div class="comment">2</div>
    </div>
    <!-- Add more gallery items as needed -->
  </div>
</body>
</html>
